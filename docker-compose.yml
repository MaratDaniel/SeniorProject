# The whole stack with one command: docker compose up --build
# Needs a .env next to this file (copy .env.example). Open http://localhost:8080
name: adal

x-api-env: &api-env
  ADAL_ENV: ${ADAL_ENV:-dev}
  ADAL_DATABASE_URL: postgresql+asyncpg://adal:${POSTGRES_PASSWORD}@db:5432/adal
  ADAL_REDIS_URL: redis://redis:6379/0
  ADAL_JWT_SECRET: ${ADAL_JWT_SECRET:?set ADAL_JWT_SECRET in .env}
  ADAL_MFA_ENCRYPTION_KEY: ${ADAL_MFA_ENCRYPTION_KEY:?set ADAL_MFA_ENCRYPTION_KEY in .env}
  ADAL_FRONTEND_URL: ${ADAL_FRONTEND_URL:-http://localhost:8080}
  ADAL_COOKIE_SECURE: ${ADAL_COOKIE_SECURE:-false}
  ADAL_MEDIA_DIR: /app/media

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: adal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: adal
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adal -d adal"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      <<: *api-env
      ADAL_SCHEDULER_ENABLED: "false"  # the worker service runs the scheduler
    volumes:
      - media:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:
  media:
