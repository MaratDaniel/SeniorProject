<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Winning Moment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
body{margin:0}
button{cursor:pointer;transition:scale 150ms ease-out,filter 150ms ease-out}
@media (hover:hover){button:not(:disabled):hover{filter:brightness(0.92)}}
button:not(:disabled):active{scale:0.96}
:focus-visible{outline:2px solid #F3F7F9;outline-offset:2px}
@media (prefers-reduced-motion:reduce){button{transition:none}button:not(:disabled):active{scale:1}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 72px 96px; background: #0A2236; color: #F3F7F9; font-family: 'Golos Text', system-ui, sans-serif; display: grid; grid-template-columns: 1fr 1fr; gap: 96px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 22px">
<div style="font-size: 16px; font-weight: 700; color: #A9C7D5">Sold to you</div>
<h2 style="margin: 0; font-family: 'Unbounded', sans-serif; font-weight: 700; font-size: 80px; line-height: 1.1; letter-spacing: -0.02em">You won.</h2>
<div>
<div style="font-size: 14px; color: #A9C7D5; font-weight: 600">Final price</div>
<div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 80px; line-height: 1.05; color: #F2B632">240.00</div>
</div>
<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #F3F7F9; max-width: 480px; text-wrap: pretty">[Listing title] is yours. Confirm with a fresh code from your authenticator app to complete the purchase.</p>
<div style="display: flex; gap: 12px; margin-top: 6px">
<button style="height: 52px; border: 0; border-radius: 12px; background: #F3F7F9; color: #0A2236; font-family: 'Golos Text', sans-serif; font-weight: 700; font-size: 16px; padding: 0 28px">Confirm purchase</button>
<button style="height: 52px; border: 1.5px solid #F3F7F9; border-radius: 12px; background: transparent; color: #F3F7F9; font-family: 'Golos Text', sans-serif; font-weight: 700; font-size: 16px; padding: 0 28px">View receipt</button>
</div>
</div>
<div style="height: 560px; display: flex; align-items: flex-end; justify-content: center; position: relative">
<div style="width: 400px; height: 100%; background: #12304A; border-radius: 999px 999px 20px 20px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 40px; color: #A9C7D5; font-size: 15px; font-weight: 600">[Listing photo, arch frame]</div>
<svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true" style="position: absolute; top: 28px; left: 50%; margin-left: -28px"><circle cx="24" cy="24" r="9" fill="#F2B632"/></svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
